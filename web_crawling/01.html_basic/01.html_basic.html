<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 문서의 잡다한 정보 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="with=device-width, initial-scale=1.0">
    <title>스타트피: 운동의 시작</title>
</head>
<body>
<!--
    목표에 도달하기 위해 시작하는 것이 중요하지만, 결국 완성하는 것이 중요하다. -Zig Ziglar(직 지글러)
    <h1>h1태그(heading) : 중요도를 나타내는 태그</h1>
    <div>
        <p>div태그(division) : 구역을 나타내는 태그</p>
        <p>p테그(paragraph) : 문단을 나타내는 태크</p>
    </div>
-->
    <h1>스타트피: 운동의 시작</h1>
    <div>
        <h1>기초 체력업! 무분할 루틴</h1>
        <p>운동을 처음 시작하는 헬린이모여</p>
        <a href="https://naver.com">지금 시작하기</a>
    </div>
    <div>
        <h1>초보탈출! 3분할 루틴</h1>
        <p>운동좀 했니? 드루와</p>
        <a href="https://naver.com">지금 시작하기</a>
    </div>
    <div>
        <h1>나만의 운동 목표 설정</h1>
        <label>
            <input type="text" placeholder="목표입력">
        </label>
        <button onclick="alert('렛츠기릿!')">저장하기</button>
        <ul>
            <li><a href="#">웨이트로 몸짱되기!</a></li>
            <li><a href="#">유산소로 다이어트!</a></li>
            <li><a href="#">필라테스로 유연성과 코어잡기!</a></li>
        </ul>
    </div>
</body>
</html>
